  <main id="content" class="entry">
    <h1>Connect</h1>
    <p>Write me a letter. It comes to my email. Name and address are optional. You can also just <a href="mailto:jasroopdhingra@gmail.com">email me</a>.</p>
    <form id="contactForm" class="letter-form" action="https://formspree.io/f/xbdaznzg" method="POST">
      <label for="message">Letter</label>
      <textarea id="message" name="message" required placeholder="What you wanted to say"></textarea>
      <label for="name">Name</label>
      <input id="name" name="name" type="text" autocomplete="name" placeholder="Your name">
      <label for="email">Email</label>
      <input id="email" name="_replyto" type="email" autocomplete="email" placeholder="So I can write back">
      <label class="check"><input id="anon" type="checkbox"> Send this without my name</label>
      <button type="submit">Send</button>
      <p id="formError" class="form-error" hidden>That didn't send. Email jasroopdhingra@gmail.com instead.</p>
    </form>
    <p id="formSent" hidden>Got it. I'll write back if you left an address.</p>
    <script>
      var form = document.getElementById("contactForm");
      var anon = document.getElementById("anon");
      var sent = document.getElementById("formSent");
      var err = document.getElementById("formError");
      anon.addEventListener("change", function () {
        var hide = anon.checked;
        document.getElementById("name").disabled = hide;
        document.getElementById("email").disabled = hide;
      });
      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        err.hidden = true;
        var data = new FormData(form);
        if (anon.checked) {
          data.set("name", "Anonymous");
          data.delete("_replyto");
        }
        try {
          var res = await fetch(form.action, {
            method: "POST",
            body: data,
            headers: { "Accept": "application/json" }
          });
          if (!res.ok) throw new Error("bad status");
          form.hidden = true;
          sent.hidden = false;
        } catch (e2) {
          err.hidden = false;
        }
      });
    </script>
